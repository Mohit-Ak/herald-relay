[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hermes-herald"
version = "0.1.0"
description = "Herald Relay plugin for Hermes — voice-first AI on mobile"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    # tunnel_cli reads/writes the herald.* block of ~/.hermes/config.yaml.
    # Hermes installs always have PyYAML, but `pip install hermes-herald` on a
    # bare box must not fail at `herald-tunnel setup` with ModuleNotFoundError.
    "pyyaml>=6.0",
]

[project.scripts]
herald-tunnel = "herald_relay.tunnel_cli:main"

[project.urls]
"Homepage" = "https://herald.app"
"Repository" = "https://github.com/Mohit-Ak/herald-relay"

# Hermes discovers pip-installed plugins via the `hermes_agent.plugins` entry
# point group (hermes_cli/plugins.py: ENTRY_POINTS_GROUP). The old
# "hermes.plugins" group was never read by any Hermes version — a plugin
# published under it installs cleanly and then silently never loads.
#
# The value must resolve to the MODULE, not the plugin class: Hermes does
# `module = ep.load()` then `getattr(module, "register")`. Pointing at
# `...:HeraldRelayPlugin` loads the class, whose namespace has no register(),
# so the plugin is dropped with error="no register() function".
[project.entry-points."hermes_agent.plugins"]
herald-relay = "herald_relay.plugin"

[tool.hatch.build.targets.wheel]
packages = ["herald_relay"]
