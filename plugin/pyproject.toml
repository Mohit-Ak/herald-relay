[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hermes-herald"
version = "0.1.0"
description = "Herald Relay plugin for Hermes — voice-first AI on mobile"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "websockets>=13.0",
    "httpx>=0.27.0",
]

[project.urls]
"Homepage" = "https://herald.app"
"Repository" = "https://github.com/Mohit-Ak/herald-relay"

[project.entry-points."hermes.plugins"]
herald-relay = "herald_relay.plugin:HeraldRelayPlugin"

[tool.hatch.build.targets.wheel]
packages = ["herald_relay"]
