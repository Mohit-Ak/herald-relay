name: Deploy Relay Backend

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'infra/Dockerfile'
      - '.dockerignore'
      - '.github/workflows/relay-deploy.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'plugin/**'
      - 'tests/**'
      - 'infra/Dockerfile'
      - '.github/workflows/relay-deploy.yml'

concurrency:
  group: relay-deploy
  cancel-in-progress: false

# The relay runs as the "relay" sidecar container of Cloud Run service
# "herald" (project eh-voice-ai, us-central1), next to the Herald backend and
# an nginx ingress, on one always-on instance. Its env comes from Secret
# Manager (herald-relay-env) mounted at /secrets/env.
#
# This job builds the relay image and swaps ONLY the relay container's image in
# the live service spec; the backend and ingress keep the images they serve.
env:
  PROJECT: eh-voice-ai
  REGION: us-central1
  SERVICE: herald

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # tests/test_rollover_e2e.py runs the pre-fix relay from history
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'  # matches infra/Dockerfile
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest pytest-asyncio respx -e plugin
      - name: Relay unit tests
        run: cd backend && python -m pytest -q
      - name: Plugin unit tests
        run: cd plugin && python -m pytest -q
      - name: End-to-end (incl. deploy rollover)
        run: python -m pytest -q tests

  deploy:
    needs: test
    # The pull_request trigger above must never deploy unmerged code.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Build relay image
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT}/herald/relay:${GITHUB_SHA:0:7}"
          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"
          cp infra/Dockerfile Dockerfile
          gcloud builds submit . --project "$PROJECT" --region "$REGION" --tag "$IMAGE" --quiet

      - name: Roll out new revision (relay container only)
        run: |
          gcloud run services describe "$SERVICE" --project "$PROJECT" --region "$REGION" \
            --format=export > svc.yaml
          python3 - <<'EOF'
          import os, yaml
          d = yaml.safe_load(open("svc.yaml"))
          spec = d["spec"]["template"]
          spec["metadata"].pop("name", None)  # let Cloud Run name the revision
          hit = [c for c in spec["spec"]["containers"] if c["name"] == "relay"]
          assert hit, "no relay container in service herald"
          hit[0]["image"] = os.environ["IMAGE"]
          yaml.safe_dump(d, open("svc.yaml", "w"), sort_keys=False)
          EOF
          gcloud run services replace svc.yaml --project "$PROJECT" --region "$REGION" --quiet

      - name: Verify relay answers through the public hostname
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://herald-api.eventhorizonlabs.xyz/push/register)
            # GET on a POST-only route: 405 means the relay itself answered.
            [ "$code" = 405 ] && { echo "✓ relay answering"; exit 0; }
            sleep 5
          done
          echo "✗ relay route /push/register returned $code (want 405)"; exit 1
