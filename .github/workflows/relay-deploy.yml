name: Deploy Relay Backend

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'

env:
  PROJECT: eh-voice-ai
  REGION: us-central1
  REGISTRY: us-central1-docker.pkg.dev
  IMAGE: us-central1-docker.pkg.dev/eh-voice-ai/herald/relay-backend
  # NOTE: `mailmind-rtc` is the pre-pivot GCE VM's immutable name, kept as an
  # opaque host id. GCE can't rename a VM in place; renaming would require
  # recreating the box from a machine image + re-pointing the IP (downtime).
  # Nothing user-facing exposes this name. See herald HERALD_MIGRATION.md §1.
  VM_NAME: mailmind-rtc
  VM_ZONE: us-central1-a

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      - name: Build Docker image
        run: |
          docker build \
            -f infra/Dockerfile \
            -t ${{ env.IMAGE }}:${{ github.sha }} \
            -t ${{ env.IMAGE }}:latest \
            .

      - name: Push Docker image
        run: |
          docker push ${{ env.IMAGE }}:${{ github.sha }}
          docker push ${{ env.IMAGE }}:latest

      - name: Set up SSH key for gcloud compute ssh
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.GCE_SSH_KEY }}" > ~/.ssh/google_compute_engine
          chmod 600 ~/.ssh/google_compute_engine
          ssh-keygen -y -f ~/.ssh/google_compute_engine > ~/.ssh/google_compute_engine.pub

      - name: Deploy to GCE VM
        run: |
          gcloud compute ssh ${{ env.VM_NAME }} \
            --zone ${{ env.VM_ZONE }} \
            --project ${{ env.PROJECT }} \
            --command "
              docker pull ${{ env.IMAGE }}:${{ github.sha }} && \
              docker stop herald-relay 2>/dev/null || true && \
              docker rm herald-relay 2>/dev/null || true && \
              docker run -d \
                --name herald-relay \
                --restart unless-stopped \
                -p 8082:8082 \
                --env-file /etc/herald-relay.env \
                ${{ env.IMAGE }}:${{ github.sha }}
            "
